<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers Management - RUDHISOFT Admin Panel</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* =========================
           CSS CUSTOM PROPERTIES
        ========================== */
        :root {
            --primary: #2e3192;
            --primary-dark: #1a1d5a;
            --primary-gradient: linear-gradient(135deg, #2e3192 0%, #1a1d5a 100%);
            --accent: #00d4ff;
            --accent-secondary: #7c3aed;
            --gold: #fbbf24;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-900: #111827;
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);
            --transition-base: 300ms cubic-bezier(0.4, 0, 0.2, 1);
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        /* =========================
           BASE STYLES
        ========================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 16px;
        }

        body {
            font-family: var(--font-primary);
            background: var(--gray-50);
            color: var(--gray-700);
            overflow-x: hidden;
        }

        /* =========================
           SIDEBAR STYLES
        ========================== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 280px;
            background: var(--primary-gradient);
            z-index: 1000;
            box-shadow: var(--shadow-xl);
            overflow-y: auto;
            transition: transform var(--transition-base);
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: var(--radius-full);
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Logo styling in sidebar */
        .logo {
            color: var(--white);
            padding: 30px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            padding: 8px;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-text {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--white);
        }

        .sidebar-menu {
            list-style: none;
            padding: 20px 15px;
            margin: 0;
        }

        .sidebar-menu li {
            margin: 8px 0;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            transition: all var(--transition-base);
            font-weight: 500;
            font-size: 0.95rem;
            position: relative;
        }

        .sidebar-menu a::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 0;
            background: var(--gold);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            transition: height var(--transition-base);
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: rgba(255, 255, 255, 0.15);
            color: var(--white);
            transform: translateX(5px);
        }

        .sidebar-menu a:hover::before,
        .sidebar-menu a.active::before {
            height: 100%;
        }

        .sidebar-menu a i {
            margin-right: 15px;
            width: 24px;
            font-size: 1.1rem;
            text-align: center;
            flex-shrink: 0;
        }

        /* Hamburger Toggle Button */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1100;
            width: 44px;
            height: 44px;
            background: var(--primary-gradient);
            border: none;
            border-radius: var(--radius-md);
            color: var(--white);
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: all var(--transition-base);
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .sidebar-toggle:hover {
            transform: scale(1.05);
        }

        .sidebar-toggle:active {
            transform: scale(0.95);
        }

        /* Close button inside sidebar (mobile only) */
        .sidebar-close {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: var(--radius-md);
            color: var(--white);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all var(--transition-base);
            z-index: 10;
        }

        .sidebar-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        /* Overlay */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-base);
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* =========================
           MAIN CONTENT
        ========================== */
        .main-content {
            margin-left: 280px;
            min-height: 100vh;
            background: var(--gray-50);
            transition: margin-left var(--transition-base);
        }

        /* =========================
           TOP NAVBAR
        ========================== */
        .top-navbar {
            background: var(--white);
            padding: 20px 35px;
            box-shadow: var(--shadow-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-navbar h4 {
            margin: 0;
            color: var(--gray-900);
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .admin-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-avatar {
            width: 40px;
            height: 40px;
            background: var(--primary-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-weight: 700;
            font-family: var(--font-display);
        }

        .admin-name {
            color: var(--gray-600);
            font-weight: 500;
        }

        .btn-logout {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: var(--white);
            border: none;
            padding: 10px 24px;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all var(--transition-base);
            font-weight: 600;
            box-shadow: var(--shadow-md);
            font-family: var(--font-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* =========================
           CONTENT AREA
        ========================== */
        .content-area {
            padding: 35px;
        }

        /* =========================
           ALERT MESSAGES
        ========================== */
        .alert {
            padding: 16px 20px;
            border-radius: var(--radius-md);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 500;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: #059669;
            border-left: 4px solid #10b981;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border-left: 4px solid #ef4444;
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            color: #d97706;
            border-left: 4px solid #f59e0b;
        }

        .alert-info {
            background: rgba(0, 212, 255, 0.1);
            color: #0891b2;
            border-left: 4px solid var(--accent);
        }

        .btn-close {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            color: inherit;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity var(--transition-base);
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-close:hover {
            opacity: 1;
        }

        .btn-close::before {
            content: '×';
            font-size: 1.5rem;
        }

        /* =========================
           TABLE CONTAINER
        ========================== */
        .table-container {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 35px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--gray-100);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--gray-100);
        }

        .table-header h5 {
            margin: 0;
            color: var(--gray-900);
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* =========================
           BUTTONS
        ========================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-full);
            font-family: var(--font-primary);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all var(--transition-base);
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            color: var(--white);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-info {
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .btn-info:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        /* =========================
           LOADING SPINNER
        ========================== */
        .loading-container {
            text-align: center;
            padding: 80px 20px;
        }

        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            color: var(--gray-500);
            font-size: 1rem;
        }

        /* =========================
           TABLE STYLES
        ========================== */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }

        .table thead {
            background: var(--gray-50);
        }

        .table thead th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: var(--gray-700);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--gray-200);
            white-space: nowrap;
        }

        .table tbody tr {
            border-bottom: 1px solid var(--gray-100);
            transition: all var(--transition-base);
        }

        .table tbody tr:hover {
            background: var(--gray-50);
        }

        .table tbody td {
            padding: 18px 16px;
            color: var(--gray-600);
            font-size: 0.95rem;
            vertical-align: middle;
        }

        .table tbody td:first-child {
            font-weight: 500;
        }

        .table tbody td strong {
            color: var(--gray-900);
            font-weight: 600;
        }

        /* =========================
           BADGE STYLES
        ========================== */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .badge.bg-success {
            background: rgba(16, 185, 129, 0.1);
            color: #059669;
        }

        .badge.bg-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
        }

        .badge.bg-warning {
            background: rgba(245, 158, 11, 0.1);
            color: #d97706;
        }

        .badge.bg-info {
            background: rgba(0, 212, 255, 0.1);
            color: #0891b2;
        }

        /* =========================
           EMPTY STATE
        ========================== */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--gray-400);
            margin-bottom: 20px;
        }

        .empty-state p {
            color: var(--gray-500);
            font-size: 1rem;
            margin-bottom: 20px;
        }

        /* =========================
           ACTION BUTTONS GROUP
        ========================== */
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* =========================
           RESPONSIVE BREAKPOINTS
        ========================== */

        /* Standard Desktop/Laptop: 1200px - 1399px */
        @media (max-width: 1399px) {
            .content-area {
                padding: 32px;
            }

            .table-container {
                padding: 32px;
            }
        }

        /* Laptop: 1024px - 1199px */
        @media (max-width: 1199px) {
            .sidebar {
                width: 260px;
            }

            .main-content {
                margin-left: 260px;
            }

            .logo {
                padding: 26px 22px;
            }

            .logo-icon {
                width: 46px;
                height: 46px;
            }

            .logo-text {
                font-size: 1.3rem;
            }

            .top-navbar {
                padding: 18px 30px;
            }

            .top-navbar h4 {
                font-size: 1.4rem;
            }

            .content-area {
                padding: 30px;
            }

            .table-container {
                padding: 30px;
            }

            .table-header h5 {
                font-size: 1.25rem;
            }

            .table thead th {
                padding: 14px;
                font-size: 0.8rem;
            }

            .table tbody td {
                padding: 16px 14px;
                font-size: 0.9rem;
            }
        }

        /* Small Laptop/Tablet Landscape: 992px - 1023px */
        @media (max-width: 1023px) {
            .sidebar {
                width: 240px;
            }

            .main-content {
                margin-left: 240px;
            }

            .logo {
                padding: 24px 20px;
            }

            .logo-icon {
                width: 44px;
                height: 44px;
            }

            .logo-text {
                font-size: 1.25rem;
            }

            .sidebar-menu {
                padding: 18px 12px;
            }

            .sidebar-menu a {
                padding: 13px 18px;
                font-size: 0.92rem;
            }

            .sidebar-menu a i {
                font-size: 1.05rem;
            }

            .content-area {
                padding: 28px;
            }

            .table-container {
                padding: 28px;
            }
        }

        /* Tablet Portrait: 768px - 991px */
        @media (max-width: 991px) {
            .sidebar {
                width: 240px;
            }
            
            .main-content {
                margin-left: 240px;
            }

            .content-area {
                padding: 26px;
            }

            .top-navbar {
                padding: 16px 26px;
            }

            .top-navbar h4 {
                font-size: 1.3rem;
            }

            .table-container {
                padding: 26px;
            }

            .table-header h5 {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 767px) {
            /* Sidebar mobile behavior */
            .sidebar {
                transform: translateX(-100%);
            }
            
            .sidebar.active {
                transform: translateX(0);
            }
            
            .sidebar-overlay {
                display: block;
            }

            /* Show close button in sidebar on mobile */
            .sidebar-close {
                display: flex;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .sidebar-toggle {
                display: flex;
            }

            /* Hide hamburger when sidebar is open */
            .sidebar.active ~ * .sidebar-toggle,
            body.sidebar-open .sidebar-toggle {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition: opacity 0.2s ease, visibility 0.2s ease;
            }
            
            /* Top navbar mobile adjustments */
            .top-navbar {
                padding: 15px 20px;
                padding-left: 70px;
            }
            
            .top-navbar h4 {
                font-size: 1.2rem;
            }
            
            .admin-name {
                display: none;
            }
            
            .btn-logout {
                padding: 8px 16px;
                font-size: 0.85rem;
            }

            .btn-logout span {
                display: none;
            }
            
            .content-area {
                padding: 20px;
            }

            .table-container {
                padding: 20px;
            }

            .table-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .table-header h5 {
                font-size: 1.1rem;
            }

            .table-responsive {
                overflow-x: auto;
            }

            .table {
                font-size: 0.85rem;
            }

            .table thead th {
                padding: 12px 8px;
                font-size: 0.75rem;
            }

            .table tbody td {
                padding: 14px 8px;
                font-size: 0.85rem;
            }

            .action-buttons {
                flex-direction: column;
                gap: 6px;
            }

            .action-buttons .btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            html {
                font-size: 14px;
            }

            .sidebar {
                width: 85%;
                max-width: 320px;
            }

            .logo {
                padding: 25px 20px;
                padding-right: 60px;
            }

            .logo-icon {
                width: 45px;
                height: 45px;
            }

            .logo-text {
                font-size: 1.3rem;
            }

            .sidebar-close {
                top: 18px;
                right: 15px;
                width: 38px;
                height: 38px;
                font-size: 1.2rem;
            }

            .sidebar-menu {
                padding: 15px 12px;
            }

            .sidebar-menu a {
                padding: 12px 16px;
                font-size: 0.9rem;
            }

            .sidebar-toggle {
                width: 42px;
                height: 42px;
                font-size: 1.1rem;
            }
            
            .top-navbar {
                padding: 12px 15px;
                padding-left: 65px;
            }

            .top-navbar h4 {
                font-size: 1rem;
            }

            .admin-avatar {
                width: 36px;
                height: 36px;
                font-size: 0.9rem;
            }

            .btn-logout {
                padding: 6px 12px;
            }
            
            .content-area {
                padding: 15px;
            }

            .table-container {
                padding: 15px;
            }

            .table-header h5 {
                font-size: 1rem;
            }

            .table thead th {
                padding: 10px 6px;
                font-size: 0.7rem;
            }

            .table tbody td {
                padding: 12px 6px;
                font-size: 0.8rem;
            }

            .btn {
                padding: 10px 18px;
                font-size: 0.9rem;
            }

            .btn-sm {
                padding: 7px 12px;
                font-size: 0.8rem;
            }

            .badge {
                padding: 4px 10px;
                font-size: 0.75rem;
            }
        }

        /* Extra small devices */
        @media (max-width: 360px) {
            .sidebar {
                width: 90%;
            }

            .logo {
                padding: 20px 15px;
                padding-right: 55px;
            }

            .logo-icon {
                width: 40px;
                height: 40px;
            }

            .logo-text {
                font-size: 1.2rem;
            }

            .sidebar-close {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }

            .sidebar-menu a {
                padding: 11px 14px;
                font-size: 0.85rem;
            }

            .sidebar-toggle {
                width: 40px;
                height: 40px;
                top: 12px;
                left: 12px;
            }

            .top-navbar {
                padding: 10px 12px;
                padding-left: 60px;
            }

            .top-navbar h4 {
                font-size: 0.95rem;
            }
        }

        /* =========================
           ACCESSIBILITY
        ========================== */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar Toggle Button (Mobile) -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Sidebar">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="logo">
            <div class="logo-icon">
                <img src="./static/images/logo.png" alt="Rudhisoft Logo" class="logo-img">
            </div>
            <span class="logo-text">RUDHISOFT</span>
            <button class="sidebar-close" id="sidebarClose" aria-label="Close Sidebar">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <ul class="sidebar-menu">
            <li>
                <a href="/dashboard">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
            </li>
            <li>
                <a href="/careers" class="active">
                    <i class="fas fa-briefcase"></i> Job Postings
                </a>
            </li>
            <li>
                <a href="/applications">
                    <i class="fas fa-file-alt"></i> Job Applications
                </a>
            </li>
            <li>
                <a href="/contacts">
                    <i class="fas fa-envelope"></i> Contacts
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Navbar -->
        <div class="top-navbar">
            <h4>Career Management</h4>
            <div class="admin-info">
                <div class="admin-profile">
                    <div class="admin-avatar">A</div>
                    <span class="admin-name" id="adminUsername">Admin</span>
                </div>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Alert Message -->
            <div id="alertMessage" class="alert" style="display: none;"></div>

            <div class="table-container">
                <div class="table-header">
                    <h5>
                        <i class="fas fa-briefcase"></i>
                        All Job Postings
                    </h5>
                    <a href="/careers/add" class="btn btn-primary">
                        <i class="fas fa-plus"></i>
                        Add New Job
                    </a>
                </div>

                <!-- Loading -->
                <div id="loading" class="loading-container">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">Loading job postings...</p>
                </div>

                <!-- Table -->
                <div class="table-responsive" id="tableWrapper" style="display: none;">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Srno</th>
                                <th>Title</th>
                                <th>Location</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="careersTableBody">
                        </tbody>
                    </table>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <i class="fas fa-inbox"></i>
                    <p>No job postings found.</p>
                    <a href="/careers/add" class="btn btn-primary">
                        <i class="fas fa-plus"></i>
                        Add Your First Job
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sidebar toggle functionality
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarClose = document.getElementById('sidebarClose');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function openSidebar() {
            sidebar.classList.add('active');
            sidebarOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            document.body.classList.add('sidebar-open');
        }

        function closeSidebar() {
            sidebar.classList.remove('active');
            sidebarOverlay.classList.remove('active');
            document.body.style.overflow = '';
            document.body.classList.remove('sidebar-open');
        }

        sidebarToggle?.addEventListener('click', openSidebar);
        sidebarClose?.addEventListener('click', closeSidebar);
        sidebarOverlay?.addEventListener('click', closeSidebar);

        // Close sidebar when clicking on menu items (mobile)
        if (window.innerWidth <= 767) {
            const menuLinks = document.querySelectorAll('.sidebar-menu a');
            menuLinks.forEach(link => {
                link.addEventListener('click', () => {
                    setTimeout(closeSidebar, 200);
                });
            });
        }

        // Close sidebar on window resize to desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth > 767) {
                closeSidebar();
            }
        });

        // Check authentication
        async function checkAuth() {
            try {
                const response = await fetch('/api/check-auth');
                const data = await response.json();
                if (!data.logged_in) {
                    window.location.href = '/';
                } else {
                    document.getElementById('adminUsername').textContent = data.username;
                    const avatarLetter = data.username.charAt(0).toUpperCase();
                    document.querySelector('.admin-avatar').textContent = avatarLetter;
                    loadCareers();
                }
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/';
            }
        }

        // Logout function
        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/';
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        // Show alert message
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `
                <span><i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-circle' : 'info-circle'}"></i> ${message}</span>
                <button type="button" class="btn-close" onclick="this.parentElement.style.display='none'"></button>
            `;
            alertDiv.style.display = 'flex';
            
            setTimeout(() => { 
                alertDiv.style.display = 'none'; 
            }, 5000);
        }

        // Load careers
        async function loadCareers() {
            try {
                const response = await fetch('/api/admin/careers');
                const result = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (result.success && result.data.length > 0) {
                    const tbody = document.getElementById('careersTableBody');
                    tbody.innerHTML = result.data.map((career, index) => `
                        <tr>
                            <td>${index + 1}</td>
                            <td><strong>${career.title}</strong></td>
                            <td>${career.location}</td>
                            <td><span class="badge bg-info">${career.job_type}</span></td>
                            <td>
                                <span class="badge ${career.status === 'active' ? 'bg-success' : 'bg-danger'}">
                                    ${career.status}
                                </span>
                            </td>
                            <td>${career.created_at ? career.created_at.split(' ')[0] : 'N/A'}</td>
                            <td>
                                <div class="action-buttons">
                                    <a href="/careers/edit/${career.id}" class="btn btn-warning btn-sm" title="Edit">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <button class="btn btn-info btn-sm" onclick="toggleStatus(${career.id})" title="Toggle Status">
                                        <i class="fas fa-sync"></i>
                                    </button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteCareer(${career.id})" title="Delete">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `).join('');
                    document.getElementById('tableWrapper').style.display = 'block';
                } else {
                    document.getElementById('emptyState').style.display = 'block';
                }
            } catch (error) {
                console.error('Load careers error:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="loading-spinner"></div>
                    <p class="loading-text" style="color: #dc2626;">Error loading job postings. Please refresh the page.</p>
                `;
            }
        }

        // Toggle status
        async function toggleStatus(id) {
            try {
                const response = await fetch(`/api/admin/careers/${id}/toggle-status`, {
                    method: 'PUT'
                });
                const result = await response.json();
                if (result.success) {
                    showAlert(result.message, 'success');
                    loadCareers();
                } else {
                    showAlert(result.message, 'danger');
                }
            } catch (error) {
                showAlert('Error toggling status', 'danger');
            }
        }

        // Delete career
        async function deleteCareer(id) {
            if (!confirm('Are you sure you want to delete this job posting? This action cannot be undone.')) return;

            try {
                const response = await fetch(`/api/admin/careers/${id}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (result.success) {
                    showAlert(result.message, 'success');
                    loadCareers();
                } else {
                    showAlert(result.message, 'danger');
                }
            } catch (error) {
                showAlert('Error deleting job posting', 'danger');
            }
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
