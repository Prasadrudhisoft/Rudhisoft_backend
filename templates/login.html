<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - RUDHISOFT</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* =========================
           CSS CUSTOM PROPERTIES
        ========================== */
        :root {
            /* Primary Colors */
            --primary: #2e3192;
            --primary-dark: #1a1d5a;
            --primary-gradient: linear-gradient(135deg, #2e3192 0%, #1a1d5a 100%);

            /* Accent Colors */
            --accent: #00d4ff;
            --accent-secondary: #7c3aed;
            --gold: #fbbf24;

            /* Neutral Colors */
            --white: #ffffff;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-900: #111827;

            /* Typography */
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Space Grotesk', sans-serif;

            /* Shadows */
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);

            /* Transitions */
            --transition-base: 300ms cubic-bezier(0.4, 0, 0.2, 1);

            /* Border Radius */
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-2xl: 32px;
            --radius-full: 9999px;
        }

        /* =========================
           RESET & BASE STYLES
        ========================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 16px;
        }

        body {
            font-family: var(--font-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--primary-gradient);
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* =========================
           ANIMATED BACKGROUND
        ========================== */
        .login-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s ease-in-out infinite;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: var(--accent);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            background: var(--accent-secondary);
            bottom: -50px;
            left: -50px;
            animation-delay: -5s;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            background: var(--gold);
            top: 50%;
            left: 20%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(30px, -30px) rotate(90deg); }
            50% { transform: translate(0, -50px) rotate(180deg); }
            75% { transform: translate(-30px, -30px) rotate(270deg); }
        }

        .login-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* =========================
           LOGIN CONTAINER
        ========================== */
        .login-container {
            background: var(--white);
            padding: 50px 45px;
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-2xl);
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo Section */
        .login-container .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: var(--primary-gradient);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: var(--shadow-lg);
            animation: pulse 2s ease-in-out infinite;
            overflow: hidden;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo-img {
            max-width: 65%;
            max-height: 65%;
            object-fit: contain;
        }

        .logo-text {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Header */
        .login-container h1 {
            text-align: center;
            margin-bottom: 12px;
            color: var(--gray-900);
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 700;
        }

        .login-subtitle {
            text-align: center;
            color: var(--gray-500);
            font-size: 0.95rem;
            margin-bottom: 35px;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--gray-700);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 1.1rem;
            transition: color var(--transition-base);
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-md);
            outline: none;
            transition: all var(--transition-base);
            font-size: 0.95rem;
            font-family: var(--font-primary);
            background: var(--white);
            color: var(--gray-900);
        }

        .form-group input::placeholder {
            color: var(--gray-400);
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(46, 49, 146, 0.1);
        }

        .form-group input:focus ~ .input-icon {
            color: var(--primary);
        }

        /* Password Input */
        .form-group input[type="password"] {
            padding-right: 48px;
        }

        /* Eye Toggle Icon */
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--gray-400);
            font-size: 1.1rem;
            transition: color var(--transition-base);
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        /* Remember Me Checkbox */
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 12px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .remember-me label {
            font-size: 0.9rem;
            color: var(--gray-600);
            cursor: pointer;
            margin: 0;
            user-select: none;
        }

        /* Login Button */
        .login-container button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--radius-full);
            background: var(--primary-gradient);
            color: var(--white);
            font-size: 1rem;
            font-weight: 600;
            font-family: var(--font-primary);
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-container button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }

        .login-container button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .login-container button:active:not(:disabled) {
            transform: translateY(0);
        }

        /* Message Alert */
        #message {
            text-align: center;
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            display: none;
            font-size: 0.9rem;
            font-weight: 500;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #message.success {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(16, 185, 129, 0.1);
            color: #059669;
            border-left: 4px solid #10b981;
        }

        #message.error {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border-left: 4px solid #ef4444;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid var(--gray-200);
        }

        .login-footer p {
            color: var(--gray-500);
            font-size: 0.85rem;
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color var(--transition-base);
        }

        .login-footer a:hover {
            color: var(--primary-dark);
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--white);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* =========================
           RESPONSIVE BREAKPOINTS
        ========================== */
        @media (max-width: 991px) {
            body {
                padding: 20px 15px;
            }

            .login-container {
                max-width: 420px;
                padding: 45px 40px;
            }

            .shape-1 { width: 350px; height: 350px; }
            .shape-2 { width: 250px; height: 250px; }
            .shape-3 { width: 180px; height: 180px; }
        }

        @media (max-width: 767px) {
            html {
                font-size: 14px;
            }

            body {
                padding: 15px;
            }

            .login-container {
                max-width: 400px;
                padding: 40px 35px;
            }

            .shape-1 { width: 280px; height: 280px; }
            .shape-2 { width: 200px; height: 200px; }
            .shape-3 { width: 150px; height: 150px; }
        }

        @media (max-width: 480px) {
            html {
                font-size: 13px;
            }

            body {
                padding: 15px 10px;
            }

            .login-container {
                max-width: 100%;
                padding: 30px 25px;
            }

            .logo-icon {
                width: 60px;
                height: 60px;
            }

            .shape-1 { width: 220px; height: 220px; }
            .shape-2 { width: 170px; height: 170px; }
            .shape-3 { width: 120px; height: 120px; }
        }

        /* Landscape Orientation */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                padding: 10px;
                align-items: flex-start;
            }

            .login-container {
                margin: 10px auto;
                padding: 25px 30px;
            }

            .logo {
                margin-bottom: 15px;
            }

            .logo-icon {
                width: 50px;
                height: 50px;
            }

            .floating-shapes {
                display: none;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline-offset: 4px;
        }

        @media (prefers-contrast: high) {
            .login-container {
                border: 2px solid var(--gray-700);
            }

            .form-group input {
                border-width: 2px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="login-bg">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
        <div class="login-grid"></div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">
                <img src="./static/images/logo.png" alt="Rudhisoft Logo" class="logo-img">
            </div>
            <span class="logo-text">RUDHISOFT</span>
        </div>

        <h1>Admin Login</h1>
        <p class="login-subtitle">Enter your credentials to access the dashboard</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    <i class="fas fa-lock input-icon"></i>
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>
            
            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>
            </div>
            
            <button type="submit" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span>Sign In</span>
            </button>
        </form>
        
        <div id="message"></div>
        
        <div class="login-footer">
            <p>&copy; 2026 <a href="/">RUDHISOFT</a>. All rights reserved.</p>
        </div>
    </div>

    <script>
        // Check if already logged in
        async function checkAuth() {
            try {
                const response = await fetch('/api/check-auth');
                const data = await response.json();
                if (data.logged_in) {
                    window.location.href = '/dashboard';
                }
            } catch (error) {
                console.error('Auth check error:', error);
            }
        }
        checkAuth();

        // Login form submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span><span>Signing In...</span>';
            message.className = '';
            message.style.display = 'none';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    message.className = 'success';
                    message.innerHTML = '<i class="fas fa-check-circle"></i><span>' + data.message + '</span>';
                    message.style.display = 'flex';
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    message.className = 'error';
                    message.innerHTML = '<i class="fas fa-exclamation-circle"></i><span>' + data.message + '</span>';
                    message.style.display = 'flex';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Sign In</span>';
                }
            } catch (error) {
                message.className = 'error';
                message.innerHTML = '<i class="fas fa-exclamation-triangle"></i><span>Server error, try again later.</span>';
                message.style.display = 'flex';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Sign In</span>';
            }
        });

        // Parallax effect on mouse move (disabled on mobile)
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const shapes = document.querySelectorAll('.shape');
                const x = e.clientX / window.innerWidth - 0.5;
                const y = e.clientY / window.innerHeight - 0.5;

                shapes.forEach((shape, i) => {
                    const speed = (i + 1) * 15;
                    shape.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
                });
            });
        }

        // Password Show / Hide Toggle
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            togglePassword.classList.toggle('fa-eye');
            togglePassword.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
